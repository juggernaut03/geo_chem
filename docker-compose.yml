version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: geochem-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: geochem
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - geochem-net

  redis:
    image: redis:7-alpine
    container_name: geochem-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geochem-net

volumes:
  mongo_data:
  redis_data:

networks:
  geochem-net:
    driver: bridge
